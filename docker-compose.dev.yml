services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./static:/app/static
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ["uvicorn", "src.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]


  frontend:
    image: node:20-slim
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_GOOGLE_CLIENT_ID=265660946902-8if3atlteseccqu5dd5sssrcf3idpcql.apps.googleusercontent.com
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: p-101-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    restart: unless-stopped

